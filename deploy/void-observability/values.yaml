# =============================================================================
# V.O.I.D. Observability Stack — Default Values
# =============================================================================
# Override any value at install time with:
#   helm install void-obs ./deploy/void-observability --set influxdb.adminToken=my-secret
# =============================================================================

# ---------------------------------------------------------------------------
# Mosquitto MQTT Broker
# ---------------------------------------------------------------------------
# The primary gateway node publishes to void/telemetry on port 1883.
# Service type defaults to LoadBalancer to expose the broker on the
# local network at <external-ip>:1883.
mosquitto:
  image: eclipse-mosquitto
  tag: "2.0"
  service:
    type: LoadBalancer
    port: 1883

# ---------------------------------------------------------------------------
# InfluxDB 2.x (Time-Series Database)
# ---------------------------------------------------------------------------
# Auto-initialises on first boot using DOCKER_INFLUXDB_INIT_* env vars.
# Uses a StatefulSet with a PVC for data persistence.
influxdb:
  image: influxdb
  tag: "2.7"
  service:
    port: 8086
  storage:
    size: 5Gi
    className: local-path    # K3s default provisioner
  auth:
    adminUser: admin
    adminPassword: void-admin-pass
    adminToken: void-admin-token
    org: void
    bucket: void_telemetry

# ---------------------------------------------------------------------------
# Telegraf (Metrics Pipeline)
# ---------------------------------------------------------------------------
# Subscribes to Mosquitto, parses the JSON telemetry, writes to InfluxDB.
# No Kubernetes Service needed — Telegraf only makes outbound connections.
telegraf:
  image: telegraf
  tag: "1.31"

# ---------------------------------------------------------------------------
# Grafana (Dashboards)
# ---------------------------------------------------------------------------
# Datasource and dashboards are auto-provisioned via ConfigMaps.
# Service type defaults to LoadBalancer for external browser access.
grafana:
  image: grafana/grafana
  tag: "11.1.0"
  service:
    type: LoadBalancer
    port: 3000
  adminPassword: admin

# ---------------------------------------------------------------------------
# Prometheus (Infrastructure Metrics)
# ---------------------------------------------------------------------------
# Scrapes /metrics endpoints from all stack components and Kubernetes
# infrastructure. Does NOT replace InfluxDB for survivor telemetry —
# Prometheus monitors the health of the stack itself.
prometheus:
  image: prom/prometheus
  tag: "v2.53.0"
  service:
    port: 9090
  storage:
    size: 2Gi
    className: local-path
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: 15d

# ---------------------------------------------------------------------------
# Alertmanager (Alert Routing & Notification)
# ---------------------------------------------------------------------------
alertmanager:
  enabled: true
  image: prom/alertmanager
  tag: "v0.27.0"
  service:
    port: 9093
  # Slack webhook URL for notifications (leave empty to disable)
  slackWebhookUrl: ""
  slackChannel: "#void-alerts"

# ---------------------------------------------------------------------------
# node-exporter (Host-Level Metrics)
# ---------------------------------------------------------------------------
# Runs as a DaemonSet — one pod per node. Exports CPU, memory, disk,
# and network metrics from the underlying host.
# Note: Requires cluster-wide RBAC permissions, which is fine for personal/K3s clusters.
nodeExporter:
  enabled: true
  image: prom/node-exporter
  tag: "v1.8.1"
  service:
    port: 9100

# ---------------------------------------------------------------------------
# kube-state-metrics (Kubernetes Object Metrics)
# ---------------------------------------------------------------------------
# Single-replica Deployment. Exports pod status, restart counts,
# deployment health, PVC usage, and other Kubernetes object state.
# Note: Requires cluster-wide RBAC permissions.
kubeStateMetrics:
  enabled: true
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics
  tag: "v2.12.0"
  service:
    port: 8080
