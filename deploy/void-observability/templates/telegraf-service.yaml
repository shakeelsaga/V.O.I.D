apiVersion: v1
kind: Service
metadata:
  name: {{ include "void-observability.fullname" . }}-telegraf
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: telegraf
spec:
  type: ClusterIP
  ports:
    - port: 9273
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "void-observability.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: telegraf
