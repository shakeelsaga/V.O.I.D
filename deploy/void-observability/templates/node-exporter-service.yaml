apiVersion: v1
kind: Service
metadata:
  name: {{ include "void-observability.fullname" . }}-node-exporter
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-exporter
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.nodeExporter.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "void-observability.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: node-exporter
