apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "void-observability.fullname" . }}-grafana-dashboard-provider
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: void-dashboards
        orgId: 1
        folder: V.O.I.D.
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
