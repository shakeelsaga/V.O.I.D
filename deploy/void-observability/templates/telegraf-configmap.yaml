apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "void-observability.fullname" . }}-telegraf
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
data:
  telegraf.conf: |
    # =========================================================================
    # Telegraf config for V.O.I.D. telemetry pipeline
    # Input:  MQTT (void/telemetry JSON from ESP32 gateway)
    # Output: InfluxDB 2.x
    # =========================================================================

    [agent]
      interval = "10s"
      flush_interval = "10s"

    # --- Input: subscribe to the MQTT topic the gateway publishes to ----------
    [[inputs.mqtt_consumer]]
      servers  = ["tcp://{{ include "void-observability.fullname" . }}-mosquitto:{{ .Values.mosquitto.service.port }}"]
      topics   = ["void/telemetry"]
      data_format = "json"
      # node_id becomes a tag so Grafana can group/filter per survivor node
      tag_keys = ["node_id"]
      # Override the default measurement name for cleaner queries
      name_override = "void_telemetry"

    # --- Output: write to InfluxDB 2.x ----------------------------------------
    [[outputs.influxdb_v2]]
      urls         = ["http://{{ include "void-observability.fullname" . }}-influxdb:{{ .Values.influxdb.service.port }}"]
      token        = "{{ .Values.influxdb.auth.adminToken }}"
      organization = "{{ .Values.influxdb.auth.org }}"
      bucket       = "{{ .Values.influxdb.auth.bucket }}"

    # --- Expose Telegraf internal metrics for Prometheus scraping -----------
    [[outputs.prometheus_client]]
      listen = ":9273"
      metric_version = 2
