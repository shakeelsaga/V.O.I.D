apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "void-observability.fullname" . }}-alertmanager
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      {{- if .Values.alertmanager.slackWebhookUrl }}
      slack_api_url: {{ .Values.alertmanager.slackWebhookUrl | quote }}
      {{- end }}

    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'default'
      {{- if .Values.alertmanager.slackWebhookUrl }}
      routes:
        - match:
            severity: critical
          receiver: 'slack-notifications'
        - match:
            severity: warning
          receiver: 'slack-notifications'
      {{- end }}

    receivers:
      - name: 'default'
      {{- if .Values.alertmanager.slackWebhookUrl }}
      - name: 'slack-notifications'
        slack_configs:
          - channel: {{ .Values.alertmanager.slackChannel | quote }}
            send_resolved: true
            title: '[{{ "{{" }} .Status | toUpper {{ "}}" }}] {{ "{{" }} .CommonLabels.alertname {{ "}}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *Alert:* {{ "{{ .Annotations.summary }}" }}
              *Description:* {{ "{{ .Annotations.description }}" }}
              *Severity:* {{ "{{ .Labels.severity }}" }}
              {{ "{{ end }}" }}
      {{- end }}
