apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "void-observability.fullname" . }}-prometheus-alert-rules
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  alert-rules.yml: |
    groups:
      - name: void-infrastructure
        rules:
          - alert: VoidPodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[5m]) * 300 > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is crash-looping"
              description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} has restarted more than 3 times in 5 minutes."

          - alert: VoidPodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is not ready"
              description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} has been in a non-ready state for longer than 2 minutes."

          - alert: VoidInfluxDBStorageHigh
            expr: (kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".*influxdb.*"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*influxdb.*"}) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "InfluxDB PVC storage is high"
              description: "InfluxDB PVC is above 80% capacity."

          - alert: VoidNodeHighCPU
            expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU on node"
              description: "Node CPU has been sustained above 90% for 5 minutes."

          - alert: VoidNodeHighMemory
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory on node"
              description: "Node memory has been sustained above 85% for 5 minutes."

          - alert: VoidNodeDiskPressure
            expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High disk usage on node"
              description: "Node root disk usage is above 85%."

          - alert: VoidInfluxDBDown
            expr: up{job="influxdb"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "InfluxDB is unreachable"
              description: "Prometheus cannot scrape InfluxDB for 1 minute."

          - alert: VoidGrafanaDown
            expr: up{job="grafana"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Grafana is unreachable"
              description: "Prometheus cannot scrape Grafana for 1 minute."
