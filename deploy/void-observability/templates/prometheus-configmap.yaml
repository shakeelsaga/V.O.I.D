apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "void-observability.fullname" . }}-prometheus
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ include "void-observability.fullname" . }}-alertmanager:{{ .Values.alertmanager.service.port }}

    scrape_configs:
      # --- Prometheus self-monitoring ---
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # --- node-exporter (host metrics) ---
      - job_name: node-exporter
        static_configs:
          - targets:
              - {{ include "void-observability.fullname" . }}-node-exporter:{{ .Values.nodeExporter.service.port }}

      # --- kube-state-metrics ---
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - {{ include "void-observability.fullname" . }}-kube-state-metrics:{{ .Values.kubeStateMetrics.service.port }}

      # --- InfluxDB native /metrics ---
      - job_name: influxdb
        static_configs:
          - targets:
              - {{ include "void-observability.fullname" . }}-influxdb:{{ .Values.influxdb.service.port }}
        metrics_path: /metrics

      # --- Grafana native /metrics ---
      - job_name: grafana
        static_configs:
          - targets:
              - {{ include "void-observability.fullname" . }}-grafana:{{ .Values.grafana.service.port }}
        metrics_path: /metrics

      # --- Telegraf internal metrics ---
      - job_name: telegraf
        static_configs:
          - targets:
              - {{ include "void-observability.fullname" . }}-telegraf:9273

      # --- cAdvisor (Container CPU/Memory metrics) ---
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
