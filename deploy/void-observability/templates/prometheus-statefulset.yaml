apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "void-observability.fullname" . }}-prometheus
  labels:
    {{- include "void-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  serviceName: {{ include "void-observability.fullname" . }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "void-observability.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "void-observability.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      serviceAccountName: {{ include "void-observability.fullname" . }}-prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image }}:{{ .Values.prometheus.tag }}"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.prometheus.retention }}"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "void-observability.fullname" . }}-prometheus
        - name: rules
          configMap:
            name: {{ include "void-observability.fullname" . }}-prometheus-alert-rules
            optional: true # allows starting if alert rules aren't created yet
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.prometheus.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.prometheus.storage.size }}
